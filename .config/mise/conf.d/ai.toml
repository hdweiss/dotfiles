[tools]
herdr = { version = "latest" }

[bootstrap.packages]
"apt:bubblewrap" = "latest"
"apt:socat" = "latest"

"pacman:bubblewrap" = "latest"
"pacman:socat" = "latest"

[env]
PI_CODING_AGENT_DIR = "~/.config/pi"

[dotfiles]
"~/.config/herdr/config.toml" = {}

"~/.claude/settings.json" = {}
"~/.claude/themes/catppuccin-frappe.json" = {}
"~/.claude/themes/omarchy.json" = {}

"~/.bashrc/claude" = { block = '''
_claude_inline() {
  if [ -t 0 ]; then
    claude -p "$*" --model claude-haiku-4-5
  else
    claude -p "$*" --model claude-haiku-4-5 < /dev/stdin
  fi
}
alias '??'='_claude_inline'
''' }
