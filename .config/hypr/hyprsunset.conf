# Automatic night light schedule.
#
# hyprsunset is started at login from ~/.config/hypr/autostart.lua
# (o.launch_on_start("hyprsunset")) and applies whichever profile below
# was most recently due. Both profiles are needed: without the 07:00 one
# the night light never switches off and stays on all day.
#
# hyprsunset's timer doesn't advance while the laptop is suspended, so the
# switches would drift or be missed. To fix that, a systemd user service
# restarts hyprsunset after every resume so it re-checks the time:
#   ~/.config/systemd/user/hyprsunset-resume.service
#   ~/.local/bin/hyprsunset-resume-restart
# Check it with: systemctl --user status hyprsunset-resume
#
# The bar toggle (omarchy toggle nightlight) overrides the schedule by hand
# until the next profile time or the next resume.
#
# After editing this file restart hyprsunset. `omarchy restart hyprsunset`
# can leave it not running (it relaunches before the old one has exited),
# so check with `pgrep -x hyprsunset` and run `uwsm-app -- hyprsunset` if needed.

# Day: no tint
profile {
    time = 07:00
    identity = true
}

# Night: warm
profile {
    time = 20:00
    temperature = 4000
}
